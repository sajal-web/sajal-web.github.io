<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sajal | Mobile App Developer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 36px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid #334155;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #ffffff;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: #3b82f6;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
            margin: 6px;
        }
        .btn:hover {
            background: #2563eb;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #475569;
            color: #cbd5e1;
        }
        .btn-outline:hover {
            background: #334155;
            color: #ffffff;
        }
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sajal Web Apps</h1>
        <p>Developer of privacy-first Android utility applications, including PDF & Image Compressor and Document Tools.</p>
        <div>
            <a class="btn" href="https://sajal-web.github.io/pdfcompressor-privacy/">Privacy Policy</a>
            <a class="btn btn-outline" href="/app-ads.txt">app-ads.txt</a>
        </div>
        <div class="footer">
            &copy; 2026 Sajal. All rights reserved.
        </div>
    </div>
</body>
</html>
